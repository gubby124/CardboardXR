name: Build iPhone IPA

on:
  workflow_dispatch:
    inputs:
      export_release:
        description: Release tag containing cardboardxr-xcode.tar.gz
        required: true
        type: string

permissions:
  # Draft build inputs require repository push access to be visible.
  contents: write

jobs:
  compile:
    # Standard hosted runners are free for public repositories.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Download the Windows-generated Xcode project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_RELEASE: ${{ inputs.export_release }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          gh release download "$EXPORT_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern cardboardxr-xcode.tar.gz --dir "$RUNNER_TEMP/export"

      - name: Compile for a physical iPhone
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xcode-project"
          tar -xzf "$RUNNER_TEMP/export/cardboardxr-xcode.tar.gz" -C "$RUNNER_TEMP/xcode-project"
          xcodebuild -version
          xcodebuild \
            -project "$RUNNER_TEMP/xcode-project/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"

      - name: Package IPA for a sideloading tool to sign
        shell: bash
        run: |
          shopt -s nullglob
          apps=("$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/"*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo '::error::Expected one compiled iPhone app.'
            exit 1
          fi
          app="${apps[0]}"
          test -f "$app/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test -f "$app/$executable"
          lipo -verify_arch arm64 "$app/$executable"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/CardboardXR-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/CardboardXR-unsigned.ipa"
          echo '### CardboardXR IPA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the CardboardXR-IPA artifact, extract its ZIP, and sign/install the IPA using your sideloading tool.' >> "$GITHUB_STEP_SUMMARY"

      - name: Save IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CardboardXR-IPA
          path: ${{ runner.temp }}/CardboardXR-unsigned.ipa
          retention-days: 3
          if-no-files-found: error

      - name: Save Xcode build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardboardxr-xcode-log
          path: ${{ runner.temp }}/xcode-build.log
          retention-days: 3
          if-no-files-found: ignore
